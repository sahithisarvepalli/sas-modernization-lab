name: SAS Static Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sas-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SAS static checks
        run: python scripts/check_sas_static.py
